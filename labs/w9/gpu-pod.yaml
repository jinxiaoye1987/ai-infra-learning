apiVersion: v1
kind: Pod
metadata:
  name: train-1gpu
spec:
  tolerations:
  - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
  containers:
  - name: main
    image: nvcr.io/nvidia/pytorch:24.05-py3   # KWOK 不会真的拉镜像
    resources:
      limits: {nvidia.com/gpu: 1}            # 扩展资源只写 limits，requests 自动等于 limits
