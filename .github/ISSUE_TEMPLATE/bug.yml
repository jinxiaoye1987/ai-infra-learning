name: 构建或页面问题
description: 本地构建、站内链接或页面显示异常
title: "fix: "
body:
  - type: markdown
    attributes:
      value: |
        请只描述可以公开的复现步骤。不要粘贴密钥、cookie、个人邮箱、真名或完整日志。
  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 哪一页、哪条命令，以及你期望看到什么。
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 环境
      description: Node 版本、操作系统，以及是否使用 GPU。没有跑过的步骤请标明。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 确认
      options:
        - label: 我没有在本 Issue 中粘贴密钥或私人信息
          required: true
